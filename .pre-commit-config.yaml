# pre-commit hooks — install once with:
#   uv tool install pre-commit   (or: pipx install pre-commit / pip install pre-commit)
#   pre-commit install
# Run on everything:  pre-commit run --all-files
#
# The web hooks use the tools installed in apps/web/node_modules (run `npm run setup:web`
# first). Keep the ruff rev in sync with apps/backend/requirements-dev.txt.
default_install_hook_types: [pre-commit]
exclude: |
  (?x)^(
    .*/node_modules/.*|
    .*/\.venv/.*|
    apps/web/build/.*|
    .*\.min\.(js|css)|
    .*package-lock\.json
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        # tsconfig/jsconfig/devcontainer files are JSONC (comments allowed)
        exclude: (^|/)(tsconfig.*|jsconfig.*|\.devcontainer.*|\.vscode/.*)\.json$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Uses apps/backend/pyproject.toml (ruff picks the closest config per file).
      - id: ruff-check
        args: [--fix]
        files: ^apps/backend/
      - id: ruff-format
        files: ^apps/backend/

  - repo: local
    hooks:
      - id: web-prettier
        name: prettier (apps/web)
        entry: node scripts/web-tool.mjs prettier --write --ignore-unknown
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|md|html|ya?ml)$
        exclude: ^apps/web/(build|public)/
      - id: web-eslint
        name: eslint (apps/web)
        entry: node scripts/web-tool.mjs eslint --fix --no-warn-ignored --max-warnings=0
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        exclude: ^apps/web/(build|public)/
