      secondary: base-neutral-300
    text:
      primary:     base-neutral-900
      secondary:   base-neutral-700
      placeholder: base-neutral-500
      disabled:    base-neutral-400
      on-accent:   base-neutral-50
    brand:
      primary:   { light: 50, soft: 200, base: 500, bold: 700, deep: 900 }
      secondary: { light: 50, soft: 200, base: 400, bold: 600, deep: 900 }
      tertiary:  { light: 50, soft: 200, base: 500, bold: 700, deep: 900 }
      quaternary: { light: 50, soft: 200, base: 500, bold: 700, deep: 900 }
      quinary:   { light: 50, soft: 200, base: 400, bold: 700, deep: 900 }
    neutral:     { light: 100, soft: 300, base: 500, bold: 700, deep: 900 }
    state:
      success: { light: 50, soft: 200, base: 500, bold: 700, deep: 900 }
      warning: { light: 50, soft: 200, base: 400, bold: 600, deep: 900 }
      error:   { light: 50, soft: 200, base: 500, bold: 700, deep: 900 }
      info:    { light: 50, soft: 200, base: 400, bold: 700, deep: 900 }
    shadcn:
      background:            neutral-light
      foreground:            neutral-deep
      card:                  base-neutral-50
      card-foreground:       neutral-deep
      popover:               base-neutral-50
      popover-foreground:    neutral-deep
      primary:               primary-base
      primary-foreground:    base-neutral-50
      secondary:             neutral-light
      secondary-foreground:  neutral-deep
      tertiary:              tertiary-base
      tertiary-foreground:   base-neutral-50
      quaternary:            quaternary-base
      quaternary-foreground: neutral-deep
      quinary:               quinary-base
      quinary-foreground:    base-neutral-50
      muted:                 neutral-light
      muted-foreground:      neutral-bold
      accent:                primary-light
      accent-foreground:     primary-bold
      destructive:           base-error-400
      destructive-foreground: base-neutral-50
      border:                border-primary
      input:                 border-primary
      ring:                  primary-base
    sidebar:
      bg:               base-neutral-50
      foreground:       neutral-deep
      primary:          primary-base
      primary-fg:       base-neutral-50
      accent:           primary-light
