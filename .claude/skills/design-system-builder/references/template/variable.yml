contrast_fg:
  white: "#FFFFFF"
  black: "#000000"

spacing:
  1:   "0.25rem"   # 4px
  1-5: "0.375rem"  # 6px
  2:   "0.5rem"    # 8px
  2-5: "0.625rem"  # 10px
  3:   "0.75rem"   # 12px
  3-5: "0.875rem"  # 14px
  4:   "1rem"      # 16px
  5:   "1.25rem"   # 20px
  6:   "1.5rem"    # 24px
  8:   "2rem"      # 32px
  10:  "2.5rem"    # 40px

# Default shape language = modern, minimal, slightly rounded (.claude/rules/web/ui-design.md):
#   rounded-md (8px) controls · rounded-lg (10px) inner panels · rounded-xl (12px) cards/dialogs/popovers.
# Change only when the brief explicitly asks for another shape language (e.g. square-cornered command UI).
# `--radius` (base, = md) is emitted by variable.py for shadcn compatibility.
border_radius:
  none: "0px"
  sm:   "6px"
  md:   "8px"
  lg:   "10px"
  xl:   "12px"
  2xl:  "16px"
  3xl:  "20px"
  full: "9999px"

border_width:
  thin:  "1px"
  md:    "2px"
  thick: "3px"
  heavy: "4px"

shadow:
  color_light: "10 10 10"
  color_dark:  "250 250 250"
  2xs: "0 1px 1px 0 rgb({color}/0.04)"
  xs:  "0 1px 2px 0 rgb({color}/0.05)"
  sm:  "0 1px 3px 0 rgb({color}/0.07), 0 1px 2px -1px rgb({color}/0.04)"
  md:  "0 4px 8px -1px rgb({color}/0.08), 0 2px 4px -2px rgb({color}/0.05)"
  lg:  "0 8px 16px 0 rgb({color}/0.10), 0 4px 6px -2px rgb({color}/0.05)"
  xl:  "0 8px 36px 0 rgb({color}/0.16)"
  2xl: "0 24px 48px -12px rgb({color}/0.20)"
  inset:
    2xs: "inset 0 1px 0 0 rgb({color}/0.05)"
    xs:  "inset 0 1px 1px 0 rgb({color}/0.06)"
    sm:  "inset 0 2px 4px 0 rgb({color}/0.06)"

typography:
  font_family:
    main:
      sans: "Inter"
      serif: "Georgia"
      mono: "JetBrains Mono"
    stacks:
      sans: "var(--font-main-sans), system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'"
      serif: "var(--font-main-serif), ui-serif, Georgia, Cambria, serif"
      mono: "var(--font-main-mono), 'Fira Code', 'Cascadia Code', ui-monospace, monospace"
  font_weight:
    regular:  400
    medium:   500
    semibold: 600
    bold:     700
  font_size:
    display:  "3.5rem"    # 56px
    h1:       "2.5rem"    # 40px
    h2:       "2rem"      # 32px
    h3:       "1.5rem"    # 24px
    h4:       "1.25rem"   # 20px
    h5:       "1.125rem"  # 18px
    h6:       "1rem"      # 16px
    body-lg:  "1rem"      # 16px
    body-md:  "0.9375rem" # 15px
    body-sm:  "0.875rem"  # 14px
    label-lg: "0.875rem"  # 14px
    label-md: "0.8125rem" # 13px
    label-sm: "0.75rem"   # 12px
  line_height:
    none:    1
    tight:   1.15
    snug:    1.3
    normal:  1.5
    relaxed: 1.625
    loose:   2
  letter_spacing:
    tighter: "-0.05em"
    tight:   "-0.025em"
    normal:  "0em"
    wide:    "0.025em"
    wider:   "0.05em"
    widest:  "0.12em"
