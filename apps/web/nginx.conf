# nginx server config for the production web image (SPA + API reverse proxy).
#
# This file is an nginx *template*: the image copies it to
# /etc/nginx/templates/default.conf.template and the official entrypoint renders it with
# envsubst into /etc/nginx/conf.d/default.conf at container start. Only variables that
# exist in the environment are substituted, so nginx's own $variables are left untouched.
#
#   BACKEND_URL            upstream for /api/v1/apps/ (default http://backend:8020)
#   NGINX_LOCAL_RESOLVERS  DNS resolvers from /etc/resolv.conf (exported automatically
#                          because the image sets NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1)
#
# The file is included inside the `http {}` block, so `map` is allowed at the top level.

# Cache policy: hashed build assets are immutable, index.html and everything else must be
# revalidated so a new deploy is picked up immediately.
# Keyed on the original request URI; API responses keep the backend's own headers.
map $request_uri $cache_control {
    default "no-cache";
    "~^/api/" "";
    "~*^/(?:assets/|css/|js/|static/)?[^/?]+[.-][A-Za-z0-9_-]{8,}\.(?:m?js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico|wasm|map)(?:\?.*)?$" "public, max-age=31536000, immutable";
    "~*^[^?]*\.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|webmanifest|txt)(?:\?.*)?$" "public, max-age=3600";
}

# WebSocket upgrade support for the API proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 50m;

    # ---------------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        application/manifest+json application/wasm
        font/ttf font/otf image/svg+xml image/x-icon;

    # ----------------------------------------------------------- response headers
    # NOTE: `add_header` is inherited only by locations that do not declare their own
    # add_header, so keep every add_header at server level.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Minimal CSP that cannot break the app; tighten script-src/connect-src per project.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    # Enable only when this server (or the load balancer in front of it) terminates TLS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----------------------------------------------------------------- API proxy
    # /api/v1/apps/<path> -> $BACKEND_URL/<path> (prefix stripped, same as the Vite dev proxy).
    # `^~` stops the regex locations below (assets, dotfiles) from capturing API paths.
    location ^~ /api/v1/apps/ {
        # Resolve the upstream per request (Docker/Kubernetes DNS) so nginx starts even if
        # the backend is not up yet and follows the backend if its IP changes.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        resolver_timeout 5s;
        set $backend_upstream "${BACKEND_URL}";

        rewrite ^/api/v1/apps/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Behind a TLS-terminating load balancer, pass its X-Forwarded-Proto instead.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Stream responses (SSE/large downloads) instead of buffering them to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Never serve dotfiles (e.g. a stray .env copied into the build).
    location ~ /\. {
        return 404;
    }

    # ------------------------------------------------------------ static assets
    # Missing files with an extension are real 404s (never the SPA shell, which would be
    # served with the wrong MIME type and break module loading).
    location ~* \.(?:m?js|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot|wasm|webmanifest|txt|xml)$ {
        try_files $uri =404;
        access_log off;
    }

    # ---------------------------------------------------------------- SPA routes
    location / {
        try_files $uri /index.html;
    }
}
