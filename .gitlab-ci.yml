# GitLab CI: lint -> test -> build for apps/backend (FastAPI) and apps/web (Vite/React).
#
# Pipelines run for merge requests, the default branch and tags (no duplicate branch+MR
# pipelines). Docker images are built on the default branch and on tags; they are pushed
# only when registry credentials are available (GitLab's built-in registry provides
# CI_REGISTRY / CI_REGISTRY_USER / CI_REGISTRY_PASSWORD automatically; for another registry
# set REGISTRY, REGISTRY_USER, REGISTRY_PASSWORD as masked CI/CD variables).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - lint
  - test
  - build

default:
  interruptible: true

variables:
  PYTHON_IMAGE: python:3.12-slim
  NODE_IMAGE: node:24-alpine
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_LINK_MODE: copy
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  npm_config_audit: "false"
  npm_config_fund: "false"

# ----------------------------------------------------------------------------- backend
.backend:
  image: $PYTHON_IMAGE
  variables:
    BE_ENVIRONMENT: test
    # Tests must not depend on a real .env; provide the one mandatory secret.
    BE_JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
  cache:
    key:
      files:
        - apps/backend/requirements.txt
        - apps/backend/requirements-dev.txt
      prefix: backend
    paths:
      - .cache/uv
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libmagic1 > /dev/null
    - pip install --quiet --disable-pip-version-check uv
    - cd apps/backend
    - uv venv .venv
    - uv pip install --python .venv/bin/python -r requirements-dev.txt
    - export PATH="$PWD/.venv/bin:$PATH"

backend:lint:
  extends: .backend
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

backend:test:
  extends: .backend
  stage: test
  needs: []
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/backend/report.xml

# Same repository/module tests against a real Postgres (the Supabase provider). The tests
# apply apps/backend/migrations/supabase/*.sql themselves and truncate tables per test.
backend:test-postgres:
  extends: .backend
  stage: test
  needs: []
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: app_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/app_test
  script:
    - pytest -m integration --junitxml=report-postgres.xml
  artifacts:
    when: always
    reports:
      junit: apps/backend/report-postgres.xml

# --------------------------------------------------------------------------------- web
.web:
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - apps/web/package-lock.json
      prefix: web
    paths:
      - .cache/npm
  before_script:
    - cd apps/web
    - npm ci --prefer-offline

web:lint:
  extends: .web
  stage: lint
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:check

web:test:
  extends: .web
  stage: test
  needs: []
  script:
    - npm run test:ci

# End-to-end smoke suite (apps/web/e2e, Playwright) against the REAL backend: Mongo + Redis
# services, seeded bootstrap admin, backend on :8021, web built and served by `vite preview`.
# scripts/e2e.mjs seeds, starts the backend, waits for /health/ready, runs the suite and stops
# the backend. The image tag must match @playwright/test in apps/web/package.json.
web:e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs: []
  services:
    - name: mongo:7
      alias: mongo
    - name: redis:7
      alias: redis
  variables:
    E2E_MONGO_URI: mongodb://mongo:27017
    E2E_REDIS_URL: redis://redis:6379/0
    # Test-only account, created by the seed inside this job's throwaway Mongo.
    E2E_ADMIN_EMAIL: admin@example.com
    E2E_ADMIN_PASSWORD: e2e-admin-password
  cache:
    - key:
        files:
          - apps/web/package-lock.json
        prefix: web
      paths:
        - .cache/npm
    - key:
        files:
          - apps/backend/requirements.txt
        prefix: backend-e2e
      paths:
        - .cache/uv
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-venv libmagic1 > /dev/null
    - python3 -m venv /opt/uv && /opt/uv/bin/pip install --quiet --disable-pip-version-check uv
    - /opt/uv/bin/uv venv --python python3 apps/backend/.venv
    - /opt/uv/bin/uv pip install --python apps/backend/.venv/bin/python -r apps/backend/requirements.txt
    - (cd apps/web && npm ci --prefer-offline)
  script:
    - node scripts/e2e.mjs
  artifacts:
    when: always
    name: web-e2e-$CI_COMMIT_SHORT_SHA
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/
      - .cache/e2e/backend.log
    reports:
      junit: apps/web/test-results/junit.xml
    expire_in: 1 week

web:build:
  extends: .web
  stage: build
  needs: ["web:lint", "web:test"]
  script:
    - npm run build
  artifacts:
    name: web-build-$CI_COMMIT_SHORT_SHA
    paths:
      - apps/web/build/
    expire_in: 1 week

# -------------------------------------------------------------------------------- docs
# Docs consistency (scripts/docs-check): links, repo paths, npm scripts, env vars, code-block
# imports and the docs/api-spec.md endpoint registry vs the FastAPI app. It needs the backend venv
# (imports and the route table; no Mongo/Redis) and plain Node (Debian's nodejs is enough).
docs:check:
  extends: .backend
  stage: lint
  needs: []
  script:
    - apt-get install -y -qq --no-install-recommends nodejs > /dev/null
    - cd "$CI_PROJECT_DIR"
    - node scripts/docs-check/index.mjs
    - node --test scripts/docs-check/test/docs-check.test.mjs

# ------------------------------------------------------------------------------ docker
docker:build:
  stage: build
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  needs: ["backend:lint", "backend:test", "backend:test-postgres", "web:lint", "web:test"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - REGISTRY="${REGISTRY:-$CI_REGISTRY}"
    - REGISTRY_USER="${REGISTRY_USER:-$CI_REGISTRY_USER}"
    - REGISTRY_PASSWORD="${REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - IMAGE_BASE="${IMAGE_BASE:-${CI_REGISTRY_IMAGE:-local/$CI_PROJECT_NAME}}"
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$IMAGE_BASE/backend:$TAG" apps/backend
    - docker build --pull -t "$IMAGE_BASE/web:$TAG" apps/web
    - |
      if [ -n "$REGISTRY" ] && [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_PASSWORD" ]; then
        echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY"
        for svc in backend web; do
          docker push "$IMAGE_BASE/$svc:$TAG"
          if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
            docker tag "$IMAGE_BASE/$svc:$TAG" "$IMAGE_BASE/$svc:latest"
            docker push "$IMAGE_BASE/$svc:latest"
          fi
        done
      else
        echo "No registry credentials available - images were built but not pushed."
      fi
